[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dog-poop-tracker"
version = "1.0.0"
description = "Server health monitoring for the civilized. Because every service drops a deuce eventually."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Dog Poop Labs" },
]
keywords = ["monitoring", "health-check", "cli", "uptime", "server", "poop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/dog-poop-tracker/dog-poop-tracker"
Repository = "https://github.com/dog-poop-tracker/dog-poop-tracker"

[project.scripts]
poop = "dpt.cli:cli"

[tool.setuptools.packages.find]
include = ["dpt*"]
